name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Formatting (Prettier)
        run: npm run format:check

  unit-tests:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run Vitest with Coverage
        run: npm run test:coverage

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 7

  security-scan:
    name: Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: NPM Dependency Audit
        run: npm audit --audit-level=high

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.88.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  build-and-bundle-size:
    name: Build & Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Dist Artifact
        run: |
          test -d dist || { echo "dist/ directory missing!"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 5

